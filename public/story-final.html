<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StoryTeller — Final Telling</title>
  <link rel="icon" type="image/png" href="/saylogo.png">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F3EDD8;
      --bg-card: #EAE3CC;
      --text:    #1C1610;
      --muted:   #7A6E5B;
      --border:  #D9D0B8;
      --ink:     #2C3C6A;
      --amber:   #C47B1A;
      --orange:  #B85A12;
      --red:     #A63A2E;
      --fd:      'Playfair Display', Georgia, serif;
      --fu:      'Inter', system-ui, sans-serif;
      --nav:     56px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--fu); -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeUp 0.4s ease both; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

    .app-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .nav-mark { font-family: var(--fd); font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; }
    .nav-right { display: flex; align-items: center; gap: 1.25rem; }
    .nav-link { font-size: 0.875rem; color: var(--muted); text-decoration: none; background: none; border: none; cursor: pointer; transition: color 0.15s; }
    .nav-link:hover { color: var(--text); }

    .view { display: none; min-height: 100dvh; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--nav) + 2rem) 1.5rem 4rem; }
    .view.active { display: flex; }

    .btn-cta {
      display: block; width: 100%; max-width: 360px;
      padding: 1rem 1.5rem;
      background: var(--ink); color: #fff; border: none; border-radius: 100px;
      font-family: var(--fu); font-size: 1rem; font-weight: 500;
      cursor: pointer; text-align: center; text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-cta:hover { opacity: 0.85; }
    .btn-cta:disabled { opacity: 0.35; cursor: default; }
    .btn-secondary {
      display: block; width: 100%; max-width: 360px;
      padding: 0.875rem 1.5rem;
      background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 100px;
      font-family: var(--fu); font-size: 0.9375rem;
      cursor: pointer; text-align: center;
      transition: color 0.15s, border-color 0.15s;
      margin-top: 0.75rem;
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--text); }

    .pulse-dots { display: flex; gap: 0.5rem; margin-top: 2.5rem; align-items: center; justify-content: center; }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: 0.3; animation: pulse 1.4s ease-in-out infinite; }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

    .page-hl { font-family: var(--fd); font-style: italic; font-size: 1.75rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 0.75rem; text-align: center; }
    .page-sub { font-size: 0.9375rem; color: var(--muted); line-height: 1.65; text-align: center; max-width: 340px; margin-bottom: 2rem; }

    /* ── SETUP VIEW ──────────────────────────────────────────── */
    #view-setup { text-align: center; }
    #setup-error { display: none; margin-top: 1.5rem; padding: 1rem 1.25rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; color: var(--red); max-width: 340px; }

    /* ── READY VIEW ──────────────────────────────────────────── */
    #view-ready { gap: 1.5rem; }
    .video-wrap {
      width: 100%; max-width: 300px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #1C1610;
      position: relative;
    }
    .video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ready-actions { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 0; align-items: center; }

    /* ── RECORDING VIEW ──────────────────────────────────────── */
    #view-recording { gap: 1rem; }
    .recording-video-wrap {
      width: 100%; max-width: 260px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #1C1610;
      flex-shrink: 0;
      position: relative;
    }
    .recording-video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rec-dot {
      position: absolute; top: 12px; left: 12px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #E53E3E;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .timer {
      font-family: var(--fd); font-size: 2.25rem; font-weight: 500;
      letter-spacing: 0.02em; color: var(--text);
      transition: color 0.3s;
    }
    .timer.amber { color: var(--amber); }
    .timer.orange { color: var(--orange); }
    .timer.red { color: var(--red); }
    .warning-banner {
      display: none;
      font-size: 0.875rem; font-weight: 500; text-align: center;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .warning-banner.amber { display: block; color: var(--amber); background: #FFF8E7; }
    .warning-banner.orange { display: block; color: var(--orange); background: #FFF3E0; }
    .warning-banner.red { display: block; color: var(--red); background: #FFF0EF; font-weight: 700; }
    .live-transcript {
      width: 100%; max-width: 360px;
      min-height: 3.5rem; max-height: 6rem;
      overflow-y: auto;
      font-size: 0.875rem; color: var(--muted); line-height: 1.6;
      font-style: italic; text-align: center;
    }
    #view-recording .btn-cta { margin-top: 0.5rem; }

    /* ── UPLOADING VIEW ──────────────────────────────────────── */
    #view-uploading { text-align: center; }

    /* ── RETAKE VIEW ─────────────────────────────────────────── */
    #view-retake { text-align: center; }
    .retake-msg { font-family: var(--fd); font-style: italic; font-size: 1.5rem; font-weight: 400; color: var(--text); margin-bottom: 2rem; max-width: 320px; line-height: 1.3; }

    @media (min-width: 640px) {
      .video-wrap { max-width: 240px; }
      .recording-video-wrap { max-width: 200px; }
    }
  </style>
</head>
<body>

  <nav class="app-nav">
    <span class="nav-mark">StoryTeller</span>
    <div class="nav-right">
      <button class="nav-link" id="signOutBtn">Sign out</button>
    </div>
  </nav>

  <!-- Setup -->
  <div id="view-setup" class="view">
    <h1 class="page-hl">Setting up your camera…</h1>
    <p class="page-sub">Allow camera and microphone access to begin.</p>
    <div class="pulse-dots">
      <div class="pulse-dot"></div>
      <div class="pulse-dot"></div>
      <div class="pulse-dot"></div>
    </div>
    <div id="setup-error">
      <p id="setup-error-msg">Camera or microphone access was denied.</p>
      <button class="btn-cta" style="margin-top:1rem" onclick="location.reload()">Try again</button>
    </div>
  </div>

  <!-- Ready -->
  <div id="view-ready" class="view">
    <div class="video-wrap">
      <video id="previewReady" autoplay muted playsinline></video>
    </div>
    <div class="ready-actions fade-in">
      <p class="page-hl" style="margin-bottom:0.25rem">Your final telling</p>
      <p class="page-sub" style="margin-bottom:1.25rem">One continuous take. Up to 3 minutes 30 seconds.</p>
      <button class="btn-cta" id="startBtn">Start recording →</button>
    </div>
  </div>

  <!-- Recording -->
  <div id="view-recording" class="view">
    <div class="recording-video-wrap">
      <video id="previewRecording" autoplay muted playsinline></video>
      <div class="rec-dot"></div>
    </div>
    <div class="timer" id="timer">0:00</div>
    <div class="warning-banner" id="warningBanner"></div>
    <div class="live-transcript" id="liveTranscript"></div>
    <button class="btn-cta" id="stopBtn">Done — I'm finished</button>
  </div>

  <!-- Uploading -->
  <div id="view-uploading" class="view">
    <h1 class="page-hl">Saving your story…</h1>
    <p class="page-sub">This will just take a moment.</p>
    <div class="pulse-dots">
      <div class="pulse-dot"></div>
      <div class="pulse-dot"></div>
      <div class="pulse-dot"></div>
    </div>
  </div>

  <!-- Retake -->
  <div id="view-retake" class="view fade-in">
    <p class="retake-msg">One more take.<br>Make it count.</p>
    <button class="btn-cta" id="retakeBtn">Record again →</button>
  </div>

  <script type="module" src="js/story/final-recorder.js"></script>
  <script>
    document.getElementById('signOutBtn').addEventListener('click', () => {
      firebase.auth().signOut().then(() => { window.location.href = '/story.html'; });
    });
  </script>

</body>
</html>
